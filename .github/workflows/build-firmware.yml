name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to build (defconfig/*.config)'
        required: true
        default: all
        type: choice
        options:
          - all
          - mt7981-ax3000
          - mt7981-ax3000-dev
          - mt7981-ax3000-cudy-tr3000-ubootmod
          - mt7981-ax3000-cudy-tr3000-mtkuboot-114m
          - mt7986-ax4200
          - mt7986-ax6000
          - mt7986-ax6000-256m
          - mt7986-ax7800
          - mt7986-ax8400
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'tag' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      cache_saver: ${{ steps.matrix.outputs.cache_saver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute defconfig matrix
        id: matrix
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'all' }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mapfile -t available < <(basename -s .config defconfig/*.config | sort)
          if [ "${#available[@]}" -eq 0 ]; then
            echo "::error::No defconfig/*.config files found in the repository"
            exit 1
          fi

          build=()
          if [ "${REQUESTED}" = "all" ]; then
            build=("${available[@]}")
          else
            valid=0
            for name in "${available[@]}"; do
              if [ "${name}" = "${REQUESTED}" ]; then
                valid=1
                break
              fi
            done
            if [ "${valid}" -ne 1 ]; then
              echo "::error::Unknown defconfig '${REQUESTED}'. Available: ${available[*]}"
              exit 1
            fi
            build=("${REQUESTED}")
          fi

          matrix_json="$(jq -cn --args '$ARGS.positional' "${build[@]}")"
          echo "matrix=${matrix_json}" >> "${GITHUB_OUTPUT}"
          echo "cache_saver=${build[0]}" >> "${GITHUB_OUTPUT}"
          echo "Build matrix: ${matrix_json}"
          echo "dl cache saver: ${build[0]}"

  build:
    name: Build ${{ matrix.defconfig }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        defconfig: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CCACHE_MAXSIZE: '3G'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            /opt/az /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -af || true
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            build-essential clang flex bison gawk g++ gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget \
            cpio python3 python3-dev python3-pip python3-ply python3-docutils \
            python3-setuptools python-is-python3 swig libelf-dev bc ccache pkg-config \
            patch diffutils perl autoconf automake libtool libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libreadline-dev lrzsz \
            nano scons squashfs-tools upx-ucl vim xxd zstd qemu-utils genisoimage \
            subversion intltool xmlto liblzma-dev liblzo2-dev bzip2 gperf help2man \
            p7zip-full texinfo device-tree-compiler curl zip

      - name: Restore download cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dl-${{ hashFiles('feeds.conf.default') }}-
            dl-

      - name: Restore ccache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.defconfig }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.defconfig }}-
            ccache-

      - name: Update and install feeds
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        env:
          DEFCONFIG: ${{ matrix.defconfig }}
        run: |
          set -euo pipefail
          if [ ! -f "defconfig/${DEFCONFIG}.config" ]; then
            echo "::error::defconfig/${DEFCONFIG}.config does not exist"
            exit 1
          fi
          cp "defconfig/${DEFCONFIG}.config" .config
          # Some defconfig templates have no trailing newline; make sure the
          # appended option does not get concatenated with the last line.
          if [ -s .config ] && [ -n "$(tail -c 1 .config)" ]; then
            echo >> .config
          fi
          echo 'CONFIG_CCACHE=y' >> .config
          echo 'CONFIG_BUILD_LOG=y' >> .config
          make defconfig

      - name: Download sources
        run: |
          set -euo pipefail
          make -j"$(nproc)" download || {
            echo "::warning::Parallel download failed, retrying serially"
            make -j1 download V=s
          }

      - name: Save download cache
        if: matrix.defconfig == needs.prepare.outputs.cache_saver
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compile firmware
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Collect firmware files
        env:
          DEFCONFIG: ${{ matrix.defconfig }}
        run: |
          set -euo pipefail
          target_dir="bin/targets/mediatek/filogic"
          if [ ! -d "${target_dir}" ]; then
            echo "::error::Firmware directory ${target_dir} does not exist"
            exit 1
          fi
          rm -rf dist
          mkdir -p dist
          find "${target_dir}" -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.img' -o -name '*.img.gz' \
               -o -name '*.fip' \
               -o -name '*.manifest' -o -name 'sha256sums' -o -name 'profiles.json' \
               -o -name '*buildinfo*' \) \
            -exec cp -v -t dist/ {} +
          if [ -z "$(find dist -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::No firmware files found in ${target_dir}"
            exit 1
          fi
          tar -czf "firmware-${DEFCONFIG}.tar.gz" -C dist .
          ls -l "firmware-${DEFCONFIG}.tar.gz"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.defconfig }}
          path: firmware-${{ matrix.defconfig }}.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.defconfig }}
          path: |
            logs/
            .config
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.defconfig }}-${{ github.run_id }}-${{ github.run_attempt }}

  release:
    name: Publish release
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f -name '*.tar.gz' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No firmware archives were downloaded"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" --title "${TAG}" --generate-notes
          fi
