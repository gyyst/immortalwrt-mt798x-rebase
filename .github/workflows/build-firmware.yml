name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to build (defconfig/*.config)'
        required: true
        default: all
        type: choice
        options:
          - all
          - mt7981-ax3000
          - mt7981-ax3000-dev
          - mt7981-ax3000-cudy-tr3000-ubootmod
          - mt7981-ax3000-cudy-tr3000-mtkuboot-114m
          - mt7986-ax4200
          - mt7986-ax6000
          - mt7986-ax6000-256m
          - mt7986-ax7800
          - mt7986-ax8400
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'tag' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      cache_saver: ${{ steps.matrix.outputs.cache_saver }}
      cache_savers: ${{ steps.matrix.outputs.cache_savers }}
      toolchain_hash: ${{ steps.toolchain.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute toolchain fingerprint
        id: toolchain
        run: |
          set -euo pipefail
          host_cc="$(gcc -dumpversion 2>/dev/null || echo unknown)"
          files_hash="$(find toolchain tools include scripts/config rules.mk Config.in -type f -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          fingerprint="$(printf '%s' "hostgcc-${host_cc}-${files_hash}" | sha256sum | cut -d' ' -f1)"
          echo "hash=${fingerprint}" >> "${GITHUB_OUTPUT}"
          echo "Toolchain fingerprint: ${fingerprint} (host gcc ${host_cc})"

      - name: Compute defconfig matrix
        id: matrix
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'all' }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mapfile -t available < <(basename -s .config defconfig/*.config | sort)
          if [ "${#available[@]}" -eq 0 ]; then
            echo "::error::No defconfig/*.config files found in the repository"
            exit 1
          fi

          build=()
          if [ "${REQUESTED}" = "all" ]; then
            build=("${available[@]}")
          else
            valid=0
            for name in "${available[@]}"; do
              if [ "${name}" = "${REQUESTED}" ]; then
                valid=1
                break
              fi
            done
            if [ "${valid}" -ne 1 ]; then
              echo "::error::Unknown defconfig '${REQUESTED}'. Available: ${available[*]}"
              exit 1
            fi
            build=("${REQUESTED}")
          fi

          # Pick one ccache saver per chip family (the one with the fewest
          # devices, i.e. the fastest job) so a run adds at most one cache
          # entry per family instead of one per defconfig.
          declare -A saver_devices=()
          declare -A saver_name=()
          for name in "${build[@]}"; do
            family="${name%%-*}"
            devices="$(grep -c '^CONFIG_TARGET_DEVICE_.*=y' "defconfig/${name}.config" || true)"
            if [ -z "${saver_name[${family}]:-}" ] || [ "${devices}" -lt "${saver_devices[${family}]}" ]; then
              saver_name[${family}]="${name}"
              saver_devices[${family}]="${devices}"
            fi
          done
          mapfile -t savers < <(for family in "${!saver_name[@]}"; do echo "${saver_name[${family}]}"; done | sort)
          savers_json="$(jq -cn --args '$ARGS.positional' "${savers[@]}")"
          echo "cache_savers=${savers_json}" >> "${GITHUB_OUTPUT}"
          echo "ccache savers: ${savers_json}"

          matrix_json="$(jq -cn --args '$ARGS.positional | map({defconfig: ., family: (split("-")[0])})' "${build[@]}")"
          echo "matrix=${matrix_json}" >> "${GITHUB_OUTPUT}"
          echo "cache_saver=${savers[0]}" >> "${GITHUB_OUTPUT}"
          echo "Build matrix: ${matrix_json}"
          echo "dl cache saver: ${savers[0]}"

  build:
    name: Build ${{ matrix.defconfig }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CCACHE_MAXSIZE: '1500M'
      # ccache defaults to an mtime-based compiler check; every CI run builds a
      # fresh cross toolchain, so that check would invalidate the whole cache.
      # Pin it to a fingerprint of the toolchain sources instead.
      CCACHE_COMPILERCHECK: string:openwrt-${{ needs.prepare.outputs.toolchain_hash }}
      # Fresh checkouts give every source file a new mtime, and some packages
      # embed __DATE__/__TIME__. Ignoring both keeps direct-mode hits.
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check disk space
        run: |
          set -euo pipefail
          # The runner root filesystem has ~145G; the image ships with enough
          # slack that deleting preinstalled SDKs (a 1.5-8 minute step in the
          # old workflow) is unnecessary. Fail early if that ever changes.
          avail_gib="$(df -BG --output=avail / | tail -n1 | tr -dc '0-9')"
          echo "Free disk: ${avail_gib}G"
          if [ "${avail_gib}" -lt 40 ]; then
            echo "::error::Only ${avail_gib}G free, need at least 40G"
            exit 1
          fi

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # Bound each mirror request so a stalled mirror cannot burn 15
          # minutes the way an un-timed-out `apt-get update` can.
          sudo -E apt-get -qq -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo -E apt-get -qq install -y --no-install-recommends \
            build-essential clang flex bison gawk g++ gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget \
            cpio python3 python3-dev python3-pip python3-ply python3-docutils \
            python3-setuptools python-is-python3 swig libelf-dev bc ccache pkg-config \
            patch diffutils perl autoconf automake libtool libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libreadline-dev lrzsz \
            nano scons squashfs-tools upx-ucl vim xxd zstd qemu-utils genisoimage \
            subversion intltool xmlto liblzma-dev liblzo2-dev bzip2 gperf help2man \
            p7zip-full texinfo device-tree-compiler curl zip

      - name: Compute download cache week
        id: dlweek
        run: echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"

      - name: Restore download cache
        id: cache_dl
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default') }}-${{ steps.dlweek.outputs.week }}
          restore-keys: |
            dl-${{ hashFiles('feeds.conf.default') }}-
            dl-

      - name: Restore ccache
        id: cache_ccache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.family }}-${{ matrix.defconfig }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.family }}-
            ccache-

      - name: Restore toolchain cache
        id: cache_toolchain
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-*
            build_dir/host
            build_dir/toolchain-*
          key: toolchain-${{ needs.prepare.outputs.toolchain_hash }}-v1
          restore-keys: |
            toolchain-

      - name: Restore feeds cache
        id: cache_feeds
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: feeds
          key: feeds-${{ hashFiles('feeds.conf.default') }}-v1
          restore-keys: |
            feeds-

      - name: Update and install feeds
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Save feeds cache
        if: matrix.defconfig == needs.prepare.outputs.cache_saver && steps.cache_feeds.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: feeds
          key: feeds-${{ hashFiles('feeds.conf.default') }}-v1

      - name: Configure build
        env:
          DEFCONFIG: ${{ matrix.defconfig }}
        run: |
          set -euo pipefail
          if [ ! -f "defconfig/${DEFCONFIG}.config" ]; then
            echo "::error::defconfig/${DEFCONFIG}.config does not exist"
            exit 1
          fi
          cp "defconfig/${DEFCONFIG}.config" .config
          # Some defconfig templates have no trailing newline; make sure the
          # appended option does not get concatenated with the last line.
          if [ -s .config ] && [ -n "$(tail -c 1 .config)" ]; then
            echo >> .config
          fi
          echo 'CONFIG_CCACHE=y' >> .config
          echo 'CONFIG_BUILD_LOG=y' >> .config
          make defconfig

      - name: Download sources
        run: |
          set -euo pipefail
          make -j"$(nproc)" download || {
            echo "::warning::Parallel download failed, retrying serially"
            make -j1 download V=s
          }

      - name: Save download cache
        if: matrix.defconfig == needs.prepare.outputs.cache_saver && steps.cache_dl.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default') }}-${{ steps.dlweek.outputs.week }}

      - name: Reset ccache stats
        run: |
          set -euo pipefail
          ccache_bin="$PWD/staging_dir/host/bin/ccache"
          if [ ! -x "${ccache_bin}" ]; then
            ccache_bin="$(command -v ccache || true)"
          fi
          if [ -n "${ccache_bin}" ]; then
            CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache" "${ccache_bin}" --zero-stats || true
          fi

      - name: Compile firmware
        run: |
          set -euo pipefail
          # OpenWrt's recursive make holds a jobserver token per nesting level,
          # so nproc alone leaves the leaves underutilized; a couple extra slots
          # compensate. The runner has 4 vCPUs / 16G, so -j6 is still safe.
          make -j$(( $(nproc) + 2 ))

      - name: Show ccache stats
        if: always()
        run: |
          set -euo pipefail
          ccache_bin="$PWD/staging_dir/host/bin/ccache"
          if [ ! -x "${ccache_bin}" ]; then
            ccache_bin="$(command -v ccache || true)"
          fi
          if [ -n "${ccache_bin}" ]; then
            CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache" "${ccache_bin}" --show-stats || true
          fi

      - name: Collect firmware files
        env:
          DEFCONFIG: ${{ matrix.defconfig }}
        run: |
          set -euo pipefail
          target_dir="bin/targets/mediatek/filogic"
          if [ ! -d "${target_dir}" ]; then
            echo "::error::Firmware directory ${target_dir} does not exist"
            exit 1
          fi
          rm -rf dist
          mkdir -p dist
          find "${target_dir}" -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.img' -o -name '*.img.gz' \
               -o -name '*.fip' \
               -o -name '*.manifest' -o -name 'sha256sums' -o -name 'profiles.json' \
               -o -name '*buildinfo*' \) \
            -exec cp -v -t dist/ {} +
          if [ -z "$(find dist -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::No firmware files found in ${target_dir}"
            exit 1
          fi
          tar -czf "firmware-${DEFCONFIG}.tar.gz" -C dist .
          ls -l "firmware-${DEFCONFIG}.tar.gz"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.defconfig }}
          path: firmware-${{ matrix.defconfig }}.tar.gz
          # The archive is already gzip-compressed; skip another zip pass.
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.defconfig }}
          path: |
            logs/
            .config
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Save toolchain cache
        # The key is deterministic, so once it exists saving is a no-op that
        # still spends a minute archiving several GB. Skip it on an exact hit.
        if: always() && matrix.defconfig == needs.prepare.outputs.cache_saver && steps.cache_toolchain.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-*
            build_dir/host
            build_dir/toolchain-*
          key: toolchain-${{ needs.prepare.outputs.toolchain_hash }}-v1

      - name: Save ccache
        if: always() && contains(fromJSON(needs.prepare.outputs.cache_savers), matrix.defconfig)
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.family }}-${{ matrix.defconfig }}-${{ github.run_id }}-${{ github.run_attempt }}

  release:
    name: Publish release
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f -name '*.tar.gz' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No firmware archives were downloaded"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" --title "${TAG}" --generate-notes
          fi
